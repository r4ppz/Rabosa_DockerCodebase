services:
  # ------------------------------------------------------------------
  # SYSTEM 1 - MAIN CRUD APPLICATION (Hotel System) on PORT 80
  # ------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app:/var/www/html
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - web_network

  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php_fpm
    volumes:
      - ./app:/var/www/html
      - ./php/conf.d:/usr/local/etc/php/conf.d
    depends_on:
      - mysql
    networks:
      - web_network

  # ------------------------------------------------------------------
  # SYSTEM 2 - MICROSERVICE API (Employee System) on PORT 81
  # ------------------------------------------------------------------
  nginx_ms:
    image: nginx:alpine
    container_name: nginx_ms
    ports:
      - "81:81"
    volumes:
      - ./microservice:/var/www/html
      - ./nginx/conf.d/microservice.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php_ms
    networks:
      - web_network

  php_ms:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php_fpm_ms
    volumes:
      - ./microservice:/var/www/html
      - ./php/conf.d:/usr/local/etc/php/conf.d
    depends_on:
      - mysql
    networks:
      - web_network

  # ------------------------------------------------------------------
  # SHARED INFRASTRUCTURE SERVICES
  # ------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: default
      MYSQL_DATABASE: hotel_db
      MYSQL_USER: default
      MYSQL_PASSWORD: default
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - web_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 100M
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - web_network

  workspace:
    image: devilbox/php-fpm:8.2-work
    container_name: workspace
    environment:
      - PHP_IDE_CONFIG=serverName=localhost
    volumes:
      - ./app:/var/www/html
      - ./microservice:/var/www/microservice
      - ./workspace:/home/workspace
    working_dir: /var/www/html
    stdin_open: true
    tty: true
    depends_on:
      - php
      - mysql
    networks:
      - web_network

  redis:
    image: redis:alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - web_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - web_network

networks:
  web_network:
    driver: bridge
